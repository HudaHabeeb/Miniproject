 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Dispute Management - SupplyScore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='core/css/style.css') }}">
</head>
<body>
    <div class="container mt-5">
        <h1>Dispute Management</h1>
        <div class="mb-3">
            <a href="{{ url_for('core.home') }}" class="btn btn-outline-secondary">← Home</a>
        </div>
        <form method="POST">
            <input type="hidden" name="user_id" value="{{ session.get('user_id') }}">
            
            <div class="mb-3">
                <label>Vendor ID:</label>
                <input type="number" name="vendor_id" class="form-control" placeholder="Enter Vendor ID" required>
            </div>
            <div class="mb-3">
                <label>Issue Description:</label>
                <textarea name="description" class="form-control" rows="4" placeholder="Describe the dispute"></textarea>
            </div>
            <button type="submit" class="btn btn-danger">Report Dispute</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
