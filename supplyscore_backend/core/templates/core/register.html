 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Register - SupplyScore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='core/css/style.css') }}">
</head>
<body>
    <div class="container mt-5">
        <h1>Register</h1>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="mt-3">
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}" role="alert">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
        {% endwith %}
        <form method="POST">
    
    <div class="mb-3">
        <label>Name:</label>
        <input type="text" name="username" class="form-control" placeholder="Enter your name" required>
    </div>
    <div class="mb-3">
        <label>Email:</label>
        <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
    </div>
    <div class="mb-3">
        <label>Password:</label>
        <div class="input-group">
            <input type="password" id="regPassword" name="password" class="form-control" placeholder="Enter your password" required>
            <button class="btn btn-outline-light" type="button" id="toggleRegPassword" aria-label="Show password">
                <span class="bi bi-eye"></span>
            </button>
        </div>
    </div>
    <div class="mb-3">
        <label>Role:</label>
        <select name="role" class="form-select" required>
            <option value="business">Business</option>
            <option value="vendor">Vendor</option>
        </select>
    </div>
    <button type="submit" class="btn btn-primary">Register</button>
</form>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function(){
            const toggle = document.getElementById('toggleRegPassword');
            const field = document.getElementById('regPassword');
            if (toggle && field) {
                toggle.addEventListener('click', () => {
                    const isPwd = field.getAttribute('type') === 'password';
                    field.setAttribute('type', isPwd ? 'text' : 'password');
                    toggle.setAttribute('aria-label', isPwd ? 'Hide password' : 'Show password');
                });
            }
        })();
    </script>
</body>
</html>
