 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Login - SupplyScore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='core/css/style.css') }}">
</head>
<body>
    <div class="container mt-5">
        <div class="row g-4 align-items-center">
            <div class="col-md-6">
                <h1 class="mb-3">Login</h1>
                {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="mt-3">
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }}" role="alert">{{ message }}</div>
                        {% endfor %}
                    </div>
                {% endif %}
                {% endwith %}
                <form method="POST">
                    
                    <div class="mb-3">
                        <label>Email:</label>
                        <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
                    </div>
                    <div class="mb-3">
                        <label>Password:</label>
                        <div class="input-group">
                            <input type="password" id="loginPassword" name="password" class="form-control" placeholder="Enter your password" required>
                            <button class="btn btn-outline-light" type="button" id="toggleLoginPassword" aria-label="Show password">
                                <span class="bi bi-eye"></span>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Login</button>
                </form>
                <div class="mt-3">
                    <span>New here? </span>
                    <a class="link-light" href="{{ url_for('core.register') }}">Create an account</a>
                </div>
            </div>
            <div class="col-md-6">
                <div class="dashboard-card glass-card text-center p-3">
                    <div class="media-frame mb-3">
                        <img src="{{ url_for('static', filename='core/img/brand_showcase.jpg') }}" alt="SupplyScore showcase" class="img-fluid media-rounded">
                    </div>
                    <div class="brand-lockup d-flex align-items-center justify-content-center gap-2">
                        <svg class="brand-icon" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <defs>
                                <linearGradient id="g2" x1="0" x2="0" y1="0" y2="1">
                                    <stop offset="0%" stop-color="#c084fc"/>
                                    <stop offset="100%" stop-color="#6d28d9"/>
                                </linearGradient>
                            </defs>
                            <circle cx="16" cy="16" r="14" fill="url(#g2)" />
                            <path d="M9.5 17.5c2.8-1.2 4.9-3.7 6.1-6.6 1.3 3.4 3.8 6.3 7 8.1l-2.3 2.3c-2.9-1.5-5.2-3.7-6.8-6.5-1.2 1.6-2.8 2.9-4.6 3.8l-1.4-1.1z" fill="#fff" opacity="0.9"/>
                        </svg>
                        <span class="brand-mark">SupplyScore</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function(){
            const toggle = document.getElementById('toggleLoginPassword');
            const field = document.getElementById('loginPassword');
            if (toggle && field) {
                toggle.addEventListener('click', () => {
                    const isPwd = field.getAttribute('type') === 'password';
                    field.setAttribute('type', isPwd ? 'text' : 'password');
                    toggle.setAttribute('aria-label', isPwd ? 'Hide password' : 'Show password');
                });
            }
        })();
    </script>
</body>
</html>
